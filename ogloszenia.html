<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ogłoszenia — Serwer PRL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>

  :root{
    --tlo: #141210;
    --tlo-karta: #1c1a17;
    --linia: #322c22;
    --czerwien: #b5152b;
    --czerwien-jasna: #d81e3a;
    --zloto: #c9a84c;
    --zloto-jasne: #e3c878;
    --tekst: #ede7d9;
    --tekst-przygaszony: #9a9284;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    background: var(--tlo);
    color: var(--tekst);
    font-family: 'PT Sans', sans-serif;
    line-height: 1.55;
    min-height: 100vh;
  }

  h1, .naglowek-tytul{
    font-family: 'Oswald', sans-serif;
    letter-spacing: 0.02em;
  }

  .kontener{
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }

  /* NAGŁÓWEK */
  .naglowek{
    position: relative;
    text-align: center;
    padding: 56px 20px 40px;
    border-bottom: 3px solid var(--czerwien);
    background: linear-gradient(180deg, rgba(181,21,43,0.10), transparent 70%);
    overflow: hidden;
  }

  .naglowek::before{
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg, var(--czerwien), var(--zloto), var(--czerwien));
  }

  .gwiazda{
    font-size: 28px;
    color: var(--zloto);
    display: block;
    margin-bottom: 14px;
  }

  .naglowek-tytul{
    font-size: clamp(26px, 5vw, 38px);
    font-weight: 700;
    color: var(--tekst);
    text-transform: uppercase;
  }

  .naglowek-podtytul{
    margin-top: 10px;
    font-size: clamp(13px, 2.2vw, 16px);
    color: var(--zloto-jasne);
    font-family: 'Oswald', sans-serif;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* NAWIGACJA */
  .zakladki{
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 24px;
    padding: 0 20px;
  }

  .zakladka{
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 10px 22px;
    background: var(--tlo-karta);
    border: 1px solid var(--linia);
    border-radius: 4px;
    color: var(--tekst-przygaszony);
    text-decoration: none;
    display: inline-block;
    transition: all 0.2s ease;
  }

  .zakladka:hover{
    color: var(--tekst);
    border-color: var(--zloto);
  }

  .zakladka.aktywna{
    background: linear-gradient(135deg, var(--czerwien), var(--czerwien-jasna));
    border-color: var(--czerwien-jasna);
    color: #fff;
  }

  .sekcja{ margin-top: 40px; }

  .sekcja-tytul{
    font-size: 13px;
    font-weight: 600;
    color: var(--zloto);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--linia);
  }

  /* WIDGET DISCORD */
  .ramka-widgetu{
    background: var(--tlo-karta);
    border: 1px solid var(--linia);
    border-radius: 6px;
    padding: 4px;
    overflow: hidden;
  }

  .ramka-widgetu widgetbot{
    display: block;
    width: 100%;
    max-width: 100%;
    height: 600px;
  }

  .przycisk-discord{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 20px;
    padding: 10px 22px;
    background: linear-gradient(135deg, var(--czerwien), var(--czerwien-jasna));
    border: 1px solid var(--czerwien-jasna);
    border-radius: 4px;
    color: #fff;
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    text-decoration: none;
    transition: opacity 0.2s ease;
  }

  .przycisk-discord:hover{
    opacity: 0.85;
  }

  .stopka{
    margin-top: 60px;
    text-align: center;
    font-size: 12px;
    color: var(--tekst-przygaszony);
    padding-top: 24px;
    border-top: 1px solid var(--linia);
  }

</style>
</head>
<body>

  <header class="naglowek">
    <span class="gwiazda">★</span>
    <h1 class="naglowek-tytul">Ogłoszenia</h1>
    <p class="naglowek-podtytul">Najświeższe Komunikaty z Serwera</p>
  </header>

  <nav class="zakladki">
    <a class="zakladka" href="regulamin.html">Regulamin</a>
    <a class="zakladka" href="index.html">Panel Główny</a>
    <a class="zakladka aktywna" href="ogloszenia.html">Ogłoszenia</a>
    <a class="zakladka" href="konstytucja.html">Konstytucja</a>
  </nav>

  <div class="kontener">

    <section class="sekcja">
      <div class="sekcja-tytul">Kanał Ogłoszeń Discord</div>

      <div class="ramka-widgetu">
        <widgetbot
          server="1548079221828755488"
          width="100%"
          height="600"
        ></widgetbot>
      </div>

      <a class="przycisk-discord" href="https://discord.gg/NuT52P6kge" target="_blank" rel="noopener">Otwórz w Discordzie</a>
    </section>

    <div class="stopka">
      Rzeczpospolita PRL — Panel odświeżany automatycznie na żywo
    </div>

  </div>

<script src="https://cdn.jsdelivr.net/npm/@widgetbot/html-embed"></script>

</body>
</html>
